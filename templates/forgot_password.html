```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: #0c1411;
            color: #172c36;
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            background: #f4f1e9;
            border: 1px solid #ded6c4;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 55px;
            height: 55px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3e7c3;
            color: #17251f;
            border-radius: 16px;
            font-family: Georgia, serif;
            font-size: 23px;
            font-weight: normal;
        }

        h2 {
            text-align: center;
            margin-bottom: 12px;
            font-family: Georgia, serif;
            font-size: 29px;
            font-weight: normal;
            color: #10251f;
        }

        .subtitle {
            text-align: center;
            color: #657780;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 26px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #526570;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 20px;
            border: 1px solid #deded9;
            border-radius: 11px;
            background: #ffffff;
            color: #172c36;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #87939a;
        }

        input:focus {
            border-color: #cba348;
            box-shadow: 0 0 0 3px rgba(203, 163, 72, 0.16);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: #cba348;
            color: #101914;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #b88d32;
            transform: translateY(-1px);
        }

        .message {
            margin-bottom: 18px;
            padding: 13px;
            border-radius: 10px;
            background: #ebe5d5;
            border: 1px solid #d7c69d;
            color: #53421f;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 23px;
            text-align: center;
            color: #9a701b;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #68490c;
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 27px;
            color: #7b8988;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .reset-card {
                padding: 28px 22px;
            }

            h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <div class="reset-card">
        <div class="logo">TV</div>

        <h2>Reset Your Password</h2>

        <p class="subtitle">
            Enter your registered email and choose a new password.
        </p>

        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}

        <form method="POST">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <label for="new_password">New Password</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                minlength="8"
                required
            >

            <label for="confirm_password">Confirm New Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="8"
                required
            >

            <button type="submit">Reset Password</button>
        </form>

        <a href="/" class="back-link">← Return to Login</a>

        <div class="footer">
            TrustVault · Secure Document Management
        </div>
    </div>
</body>
</html>
```
